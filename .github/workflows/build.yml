name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TisViewer.csproj

      - name: Build
        run: dotnet build TisViewer.csproj -c Release --no-restore

      - name: Publish single file
        run: >
          dotnet publish TisViewer.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:EnableSingleFileAnalyzer=false
          -p:DebugType=none -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TisViewer-win-x64
          path: dist/TisViewer.exe
          if-no-files-found: error
